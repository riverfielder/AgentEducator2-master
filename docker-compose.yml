version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend/static:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
